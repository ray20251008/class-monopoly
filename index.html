<body>

<canvas id="gameCanvas" width="969" height="515"></canvas>

<!-- 狀態面板 (遊戲進行中顯示) -->
<div id="ui-layer" class="hidden">
    <h2 class="text-xl font-bold text-blue-800 mb-3"><i class="fas fa-trophy text-yellow-500"></i> 得分板 (滿分100)</h2>
    <!-- 得分列表 (依人數伸縮) -->
    <div id="players-list" class="space-y-2 mb-4"></div>
    <!-- 重新開始按鈕 -->
    <button onclick="location.reload()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-bold transition shadow-md w-full">
        <i class="fas fa-redo mr-1"></i> 重新開始
    </button>
</div>

<button id="dice-btn" class="hidden"><i class="fas fa-dice"></i> 擲骰子</button>

<!-- 初始畫面 (角色選擇、規則與工具列) -->
<div id="setup-screen" class="overlay">
    <div class="modal relative">
        <div class="flex justify-center md:justify-end gap-2 mb-4">
            <button onclick="exportGame()" class="tool-btn btn-export text-sm" title="匯出成 HTML 檔案">
                <i class="fas fa-file-export"></i> 匯出網頁
            </button>
            <button onclick="openEditor()" class="tool-btn btn-edit text-sm">
                <i class="fas fa-edit"></i> 題目修改
            </button>
        </div>
        
        <h1 class="text-3xl font-bold mb-4 text-green-600">🌟 班會生活大富翁 🌟</h1>
        
        <div class="bg-gray-50 p-4 rounded-lg text-sm border border-gray-200 text-left mb-6">
            <h3 class="font-bold mb-2 text-gray-700">📜 遊戲規則：</h3>
            <ul class="list-disc list-inside space-y-1 text-gray-600 text-sm">
                <li>全場共 20 格，繞行一周吧！</li>
                <li>回答正確可獲得 10 分獎勵。</li>
                <li>特殊格可能有額外驚喜。</li>
                <li>最先獲得 100 分者獲勝！</li>
            </ul>
        </div>

        <p class="mb-4 text-gray-800 font-bold text-lg">👉 請選擇遊玩人數 (1-3人)</p>
        <div class="flex justify-center gap-4 mb-2">
            <button class="btn" onclick="startGame(1)">1 人</button>
            <button class="btn" onclick="startGame(2)">2 人</button>
            <button class="btn" onclick="startGame(3)">3 人</button>
        </div>
    </div>
</div>

<!-- 答題畫面 -->
<div id="question-modal" class="overlay hidden">
    <div class="modal">
        <div id="q-icon" class="text-5xl mb-2"></div>
        <h2 id="q-title" class="text-2xl font-bold mb-2"></h2>
        <p id="q-content" class="text-lg text-gray-700 mb-6 font-bold"></p>
        <div id="q-options"></div>
    </div>
</div>

<!-- 勝利畫面 -->
<div id="win-screen" class="overlay hidden">
    <div class="modal">
        <h1 class="text-4xl font-bold mb-4 text-yellow-500">🎉 恭喜過關！ 🎉</h1>
        <div id="rankings" class="mb-6 space-y-3"></div>
        <button class="btn" onclick="location.reload()">重新開始</button>
    </div>
</div>

<!-- 編輯器畫面 -->
<div id="editor-modal" class="overlay hidden bg-black/50">
    <div class="modal editor-modal flex flex-col h-[85vh]">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
            <h2 class="text-2xl font-bold text-gray-800">修改 20 格題目內容</h2>
            <button onclick="closeEditor()" class="text-gray-500 text-3xl hover:text-red-500 bg-transparent border-none cursor-pointer">×</button>
        </div>
        
        <!-- 快速出題工具 (更簡潔的排版) -->
        <div class="mb-4 p-3 bg-green-50 border border-green-200 rounded-lg text-sm">
            <h3 class="font-bold text-green-800 mb-2 flex items-center gap-2">
                <i class="fas fa-magic"></i> 快速出題工具 (免 API Key)
            </h3>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <!-- 步驟 1 -->
                <div class="flex flex-col gap-1">
                    <span class="font-bold text-gray-600">1. 讀取講義</span>
                    <div class="flex gap-1">
                        <input type="file" id="pdf-upload" accept="application/pdf" class="text-[10px] border p-1 rounded bg-white w-full">
                        <button onclick="processPDF()" id="btn-process" class="bg-green-600 text-white px-2 py-1 rounded text-xs whitespace-nowrap">讀取</button>
                    </div>
                </div>

                <!-- 步驟 2 -->
                <div id="step-2-area" class="flex flex-col gap-1">
                    <span class="font-bold text-gray-600">2. 生成指令</span>
                    <button onclick="copyAIPrompt()" class="bg-blue-500 hover:bg-blue-600 text-white px-2 py-1 rounded text-xs font-bold">
                        複製出題指令
                    </button>
                </div>

                <!-- 步驟 3 -->
                <div id="step-3-area" class="flex flex-col gap-1">
                    <span class="font-bold text-gray-600">3. 貼回結果</span>
                    <div class="flex gap-1">
                        <input type="text" id="import-text-simple" placeholder="在此貼上 AI 回傳資料" class="flex-1 p-1 text-[10px] border rounded outline-none">
                        <button onclick="importTilesFromTextSimple()" class="bg-green-600 text-white px-2 py-1 rounded text-xs whitespace-nowrap">更新</button>
                    </div>
                </div>
            </div>
            <p id="ai-status" class="text-[10px] text-gray-500 mt-2">※ 您也可以直接在下方手動修改每一格的內容。</p>
        </div>
        <div id="editor-list" class="flex-1 overflow-y-auto pr-2 space-y-4">
            <!-- 動態產生編輯區塊 -->
        </div>
        <div class="mt-4 pt-4 border-t flex justify-end">
            <button onclick="saveAllTiles()" class="btn">儲存並更新遊戲</button>
        </div>
    </div>
</div>

// --- 音效引擎 (Web Audio API) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let isPlayingBGM = false;

function playTone(freq, type, duration, vol) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
}

function playJump() {
    playTone(400, 'sine', 0.1, 0.3);
    setTimeout(() => playTone(600, 'sine', 0.15, 0.3), 100);
}

function playDice() {
    for(let i=0; i<5; i++) {
        setTimeout(() => playTone(Math.random()*400+200, 'square', 0.05, 0.1), i*80);
    }
}

function playWin() {
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        setTimeout(() => playTone(freq, 'triangle', 0.3, 0.3), i * 150);
    });
    setTimeout(() => playTone(1046.50, 'triangle', 0.8, 0.3), 600);
}

function startBGM() {
    if (isPlayingBGM) return;
    isPlayingBGM = true;
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const bgmOsc = audioCtx.createOscillator();
    const bgmGain = audioCtx.createGain();
    bgmOsc.type = 'triangle'; bgmGain.gain.value = 0.05;
    bgmOsc.connect(bgmGain); bgmGain.connect(audioCtx.destination);
    bgmOsc.start();
    const melody = [261.6, 329.6, 392.0, 329.6, 261.6, 392.0, 440.0, 392.0];
    let step = 0;
    setInterval(() => { bgmOsc.frequency.setValueAtTime(melody[step % melody.length], audioCtx.currentTime); step++; }, 500);
}

// --- Canvas 核心 ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let w, h;
const WIN_SCORE = 100;
let players = [];
let currentPlayerIdx = 0;
let mapCoords = [];
let isAnimating = false;
let confettis = [];

const colors = [
    { main: '#22c55e', border: '#14532d' }, // 綠
    { main: '#ef4444', border: '#7f1d1d' }, // 紅
    { main: '#3b82f6', border: '#1e3a8a' }  // 藍
];

function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    calcMapCoords();
}
window.addEventListener('resize', resize);

// 建立 20 格坐標 (強制上下7格、左右3格的等距比例)
function calcMapCoords() {
    mapCoords = [];
    let mapWidth = w * 0.85;
    let mapHeight = mapWidth / 1.5;

    if (mapHeight > h * 0.85) {
        mapHeight = h * 0.85;
        mapWidth = mapHeight * 1.5;
    }

    const offsetX = (w - mapWidth) / 2;
    const offsetY = (h - mapHeight) / 2;
    const tileW = mapWidth / 6;
    const tileH = mapHeight / 4;

    // 底邊 (0-6): 7格
    for(let i=0; i<=6; i++) mapCoords.push({x: offsetX + i*tileW, y: offsetY + mapHeight});
    // 右邊 (7-9): 3格
    for(let i=1; i<=3; i++) mapCoords.push({x: offsetX + mapWidth, y: offsetY + mapHeight - i*tileH});
    // 頂邊 (10-16): 7格
    for(let i=6; i>=0; i--) mapCoords.push({x: offsetX + i*tileW, y: offsetY});
    // 左邊 (17-19): 3格
    for(let i=1; i<=3; i++) mapCoords.push({x: offsetX, y: offsetY + i*tileH});
}

function startGame(numPlayers) {
    startBGM();
    players = [];
    for(let i=0; i<numPlayers; i++) {
        players.push({
            id: i, name: `玩家 ${i+1}`, color: colors[i], pos: 0, score: 0, visX: 0, visY: 0
        });
    }
    resize();
    players.forEach(p => { p.visX = mapCoords[p.pos].x; p.visY = mapCoords[p.pos].y; });

    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('ui-layer').classList.remove('hidden');
    document.getElementById('dice-btn').classList.remove('hidden');
    updateUI();
    loop();
}

function drawBoard() {
    ctx.fillStyle = '#f0fdf4';
    ctx.fillRect(0, 0, w, h);
    
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    const tileSpacing = mapCoords.length > 1 ? Math.abs(mapCoords[1].x - mapCoords[0].x) : Math.min(w, h) * 0.1;
    const size = Math.min(tileSpacing * 0.35, Math.min(w, h) * 0.06);

    mapCoords.forEach((coord, i) => {
        const data = tilesData[i];
        
        ctx.fillStyle = '#cbd5e1'; 
        ctx.beginPath();
        ctx.roundRect(coord.x - size, coord.y - size + 8, size*2, size*2, 12);
        ctx.fill();
        
        ctx.fillStyle = (i === 0) ? '#fef08a' : '#ffffff';
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.roundRect(coord.x - size, coord.y - size, size*2, size*2, 12);
        ctx.fill(); ctx.stroke();

        ctx.font = `${size*0.8}px Arial`;
        ctx.fillText(data.icon, coord.x, coord.y - size*0.1);
        ctx.font = `bold ${size*0.3}px Microsoft JhengHei`;
        ctx.fillStyle = '#166534';
        ctx.fillText(data.title, coord.x, coord.y + size*0.6);
    });
}

function drawPlayers() {
    const size = Math.min(w, h) * 0.03;
    players.forEach((p, idx) => {
        const offset = (idx - (players.length-1)/2) * (size*0.8);
        const px = p.visX + offset;
        const py = p.visY;

        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(px, py + size, size*0.8, size*0.3, 0, 0, Math.PI*2);
        ctx.fill();

        if (idx === currentPlayerIdx && !isAnimating) {
            const pulse = Math.sin(Date.now() / 200) * 5 + 5;
            ctx.strokeStyle = '#facc15';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(px, py - size*0.5, size + pulse, 0, Math.PI*2);
            ctx.stroke();
        }

        ctx.fillStyle = p.color.main;
        ctx.strokeStyle = p.color.border;
        ctx.lineWidth = 3;
        
        ctx.beginPath();
        ctx.moveTo(px, py - size);
        ctx.quadraticCurveTo(px + size, py + size*0.5, px + size, py + size);
        ctx.lineTo(px - size, py + size);
        ctx.quadraticCurveTo(px - size, py + size*0.5, px, py - size);
        ctx.fill(); ctx.stroke();

        ctx.beginPath();
        ctx.arc(px, py - size, size*0.7, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();
    });
}

function animateJump(player, targetPosIndex, callback) {
    isAnimating = true;
    const startX = player.visX, startY = player.visY;
    const targetX = mapCoords[targetPosIndex].x, targetY = mapCoords[targetPosIndex].y;
    let progress = 0;
    playJump();

    function step() {
        progress += 0.08;
        if (progress >= 1) {
            player.visX = targetX; player.visY = targetY;
            isAnimating = false;
            if(callback) callback();
            return;
        }
        player.visX = startX + (targetX - startX) * progress;
        const jumpHeight = 60;
        player.visY = startY + (targetY - startY) * progress - Math.sin(progress * Math.PI) * jumpHeight;
        requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
}

document.getElementById('dice-btn').addEventListener('click', () => {
    if(isAnimating) return;
    const btn = document.getElementById('dice-btn');
    btn.disabled = true;
    playDice();
    
    let rolls = 0, finalDice = 1;
    const rollAnim = setInterval(() => {
        finalDice = Math.floor(Math.random() * 6) + 1;
        btn.innerHTML = `<i class="fas fa-dice"></i> ${finalDice}`;
        rolls++;
        if (rolls > 15) {
            clearInterval(rollAnim);
            btn.innerText = `前進 ${finalDice} 步!`;
            movePlayerStepByStep(players[currentPlayerIdx], finalDice, () => {
                setTimeout(() => {
                    btn.innerHTML = `<i class="fas fa-dice"></i> 擲骰子`;
                    triggerQuestion();
                }, 300);
            });
        }
    }, 50);
});

function movePlayerStepByStep(player, stepsLeft, onComplete) {
    if (stepsLeft === 0) { onComplete(); return; }
    player.pos = (player.pos + 1) % 20;
    animateJump(player, player.pos, () => movePlayerStepByStep(player, stepsLeft - 1, onComplete));
}

function triggerQuestion() {
    const p = players[currentPlayerIdx];
    const data = tilesData[p.pos];
    
    if (data.type === 'start') {
        alert("回到起點，繼續努力！");
        nextTurn(); return;
    }

    const modal = document.getElementById('question-modal');
    document.getElementById('q-icon').innerText = data.icon;
    document.getElementById('q-title').innerText = data.title;
    document.getElementById('q-content').innerText = data.q;
    
    const opts = document.getElementById('q-options');
    opts.innerHTML = '';
    data.options.forEach((opt, idx) => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.innerText = `${idx + 1}. ${opt}`;
        b.onclick = () => handleAnswer(idx, data.correct, data.type === 'move');
        opts.appendChild(b);
    });
    modal.classList.remove('hidden');
}

function handleAnswer(selected, correct, isMoveTile) {
    document.getElementById('question-modal').classList.add('hidden');
    const p = players[currentPlayerIdx];
    
    if (selected === correct) {
        p.score += 10;
        playTone(600, 'sine', 0.1, 0.3); setTimeout(()=>playTone(800, 'sine', 0.2, 0.3), 100);
        updateUI();
        
        if (p.score >= WIN_SCORE) { triggerWin(); return; }
        if (isMoveTile) {
            alert("答對了！特殊加成：再前進 2 步！");
            movePlayerStepByStep(p, 2, nextTurn); return;
        }
    } else {
        playTone(300, 'sawtooth', 0.3, 0.3);
    }
    nextTurn();
}

function nextTurn() {
    currentPlayerIdx = (currentPlayerIdx + 1) % players.length;
    document.getElementById('dice-btn').disabled = false;
    updateUI();
}

function updateUI() {
    const list = document.getElementById('players-list');
    list.innerHTML = '';
    players.forEach((p, i) => {
        const div = document.createElement('div');
        div.className = `p-2 rounded-lg font-bold flex justify-between items-center ${i === currentPlayerIdx ? 'bg-blue-100 border-2 border-blue-400' : 'bg-gray-50 text-gray-500'}`;
        div.innerHTML = `<span style="color:${p.color.main}"><i class="fas fa-circle text-[10px] mr-1"></i>${p.name}</span> <span>${p.score} 分</span>`;
        list.appendChild(div);
    });
}

function triggerWin() {
    document.getElementById('ui-layer').classList.add('hidden');
    document.getElementById('dice-btn').classList.add('hidden');
    playWin();
    
    const sorted = [...players].sort((a,b) => b.score - a.score);
    const ranks = document.getElementById('rankings');
    ranks.innerHTML = '';
    sorted.forEach((p, i) => {
        let pawnIcon = `<div style="display:inline-block; width:18px; height:18px; border-radius:50%; background:${p.color.main}; border:2px solid ${p.color.border}; margin-right:8px; vertical-align:middle;"></div>`;
        ranks.innerHTML += `<div class="text-xl flex items-center justify-center ${i===0?'text-2xl text-red-500 font-bold':''}">${pawnIcon} 第 ${i+1} 名: ${p.name} (${p.score} 分)</div>`;
    });
    
    document.getElementById('win-screen').classList.remove('hidden');
    for(let i=0; i<150; i++) {
        confettis.push({
            x: Math.random() * w, y: Math.random() * -h, r: Math.random() * 6 + 2,
            dx: Math.random() * 4 - 2, dy: Math.random() * 5 + 2, color: `hsl(${Math.random()*360}, 100%, 50%)`
        });
    }
}

function drawConfetti() {
    confettis.forEach(c => {
        ctx.fillStyle = c.color;
        ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI*2); ctx.fill();
        c.x += c.dx; c.y += c.dy;
        if(c.y > h) { c.y = -10; c.x = Math.random() * w; }
    });
}

function loop() {
    drawBoard();
    drawPlayers();
    if (confettis.length > 0) drawConfetti();
    requestAnimationFrame(loop);
}

// --- 編輯與匯出系統 ---
function openEditor() {
    const list = document.getElementById('editor-list');

        const item = document.createElement('div');

            <div class="flex items-center gap-2 mb-3 bg-white p-2 rounded-lg border">
                <span class="bg-green-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold">${i + 1}</span>
                <input type="text" value="${tile.title}" id="edit-title-${i}" class="flex-1 font-bold outline-none text-lg" placeholder="標題">

            </div>
            <div class="space-y-2">

            </div>
        `;

    });
    document.getElementById('editor-modal').classList.remove('hidden');
}

function closeEditor() {
    document.getElementById('editor-modal').classList.add('hidden');
}

function saveAllTiles() {
    tilesData.forEach((tile, i) => {
        tile.title = document.getElementById(`edit-title-${i}`).value;
        tile.icon = document.getElementById(`edit-icon-${i}`).value;
        tile.q = document.getElementById(`edit-q-${i}`).value;
        tile.options = document.getElementById(`edit-opts-${i}`).value.split('\n').filter(s => s.trim() !== '');
        tile.correct = parseInt(document.getElementById(`edit-correct-${i}`).value);
    });
    closeEditor();
    alert("20 格題目已更新完畢！");
}

function exportGame() {
    const currentHtml = document.documentElement.outerHTML;
    
    // 尋找原始的 tilesData 陣列並進行替換，實現資料持久化
    const regex = /let tilesData = \[[\s\S]*?\];/;
    const newTilesDataStr = `let tilesData = ${JSON.stringify(tilesData, null, 4)};`;
    const updatedHtml = currentHtml.replace(regex, newTilesDataStr);

    const blob = new Blob([updatedHtml], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `班會大富翁_Canvas版_${new Date().toLocaleDateString().replace(/\//g, '-')}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

// --- 免 API 題目出題系統 ---
let extractedPDFText = "";

async function processPDF() {
    const fileInput = document.getElementById('pdf-upload');
    const statusText = document.getElementById('ai-status');
    const btn = document.getElementById('btn-process');

    if (!fileInput.files || fileInput.files.length === 0) {
        alert("請先選擇 PDF 講義檔案！");
        return;
    }

    try {
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 讀取中...';
        statusText.innerHTML = "正在解析 PDF 文字內容...";
        
        const file = fileInput.files[0];
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let fullText = "";
        for (let i = 1; i <= Math.min(pdf.numPages, 15); i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            fullText += content.items.map(item => item.str).join(" ") + " ";
        }
        
        extractedPDFText = fullText.substring(0, 20000); 
        
        if (!extractedPDFText.trim()) {
            throw new Error("無法從 PDF 中提取文字，請確認該 PDF 是否為純圖片（掃描檔）。");
        }

        document.getElementById('step-2-area').style.opacity = "1";
        document.getElementById('step-2-area').style.pointerEvents = "auto";
        statusText.innerHTML = "<span class='text-green-600 font-bold'>✅ PDF 讀取成功！請執行步驟 2 複製指令。</span>";
        alert("PDF 內容讀取成功！請繼續執行下一個步驟。");

    } catch (error) {
        console.error(error);
        statusText.innerHTML = `<span class='text-red-600 font-bold'>錯誤：${error.message}</span>`;
        alert(error.message);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '讀取內容';
    }
}

    if (!extractedPDFText) return;
    
    const prompt = `你是一個專業的出題老師。請根據以下課程講義內容，生成剛好 19 道單選題，供大富翁遊戲使用。
要求：

格式範例：
[

]

講義內容如下：
${extractedPDFText}`;

function importTilesFromTextSimple() {
    const text = document.getElementById('import-text-simple').value.trim();
    if (!text) {
        alert("請先貼上 AI 回傳的題目資料！");
        return;
    }
    
    let cleanText = text;
    if (text.includes("```")) {
        cleanText = text.replace(/```json\n?|```/g, "").trim();
    }

    try {
        const data = JSON.parse(cleanText);
        let newData = data;
        if (data.length === 19) {
            const startTile = { "title": "起點", "icon": "🚩", "type": "start", "q": "出發吧！", "options": [], "correct": 0 };
            newData = [startTile, ...data];
        }
        
        tilesData = newData;
        openEditor(); 
        alert("🎉 題目已更新！");
        document.getElementById('import-text-simple').value = '';
    } catch (err) {
        alert("匯入失敗：請確保格式正確。");
    }
}
