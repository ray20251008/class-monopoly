<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班會生活實踐大富翁 - Canvas 完整雲端版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #cffafe; font-family: "Microsoft JhengHei", sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 50; }
        .modal { pointer-events: auto; background: rgba(255, 255, 255, 0.98); padding: 2rem; border-radius: 1.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); max-width: 500px; width: 90%; text-align: center; border: 4px solid #22c55e; max-height: 90vh; overflow-y: auto;}
        .editor-modal { max-width: 800px; width: 95%; text-align: left; padding: 1.5rem; }
        .btn { display: inline-block; background: #22c55e; color: white; padding: 0.75rem 1.5rem; border-radius: 0.75rem; font-weight: bold; cursor: pointer; transition: transform 0.1s; margin: 0.5rem; border: none; font-size: 1.1rem; }
        .btn:hover { background: #16a34a; transform: scale(1.05); }
        .tool-btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s; border: none; color: white;}
        .btn-export { background: #3b82f6; } 
        .btn-edit { background: #10b981; }
        #ui-layer { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); pointer-events: auto; background: rgba(255,255,255,0.95); padding: 1.25rem; border-radius: 1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border: 2px solid #3b82f6; width: auto; min-width: 260px; text-align: center;}
        #dice-btn { position: absolute; top: 72%; left: 50%; transform: translate(-50%, -50%); pointer-events: auto; background: linear-gradient(to bottom, #ff7e33, #f97316); box-shadow: 0 6px 0 #c2410c; font-size: 1.5rem; padding: 1rem 3rem; white-space: nowrap; color: white; font-weight: bold; border-radius: 1rem; border: none; cursor: pointer; transition: 0.1s;}
        .opt-btn { display: block; width: 100%; margin: 0.5rem 0; background: #f0fdf4; border: 2px solid #bbf7d0; color: #166534; padding: 1rem; border-radius: 0.75rem; cursor: pointer; font-size: 1.1rem; transition: 0.2s; text-align: left;}
        .hidden { display: none !important; }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer" class="hidden">
    <h2 class="text-xl font-bold text-blue-800 mb-3"><i class="fas fa-trophy text-yellow-500"></i> 得分板 (滿分100)</h2>
    <div id="players-list" class="space-y-2 mb-4"></div>
    <button onclick="location.reload()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-bold transition shadow-md w-full">重新開始</button>
</div>

<button id="dice-btn" class="hidden"><i class="fas fa-dice"></i> 擲骰子</button>

<div id="setup-screen" class="overlay">
    <div class="modal relative">
        <div class="flex justify-end gap-2 mb-4">
            <button onclick="exportGame()" class="tool-btn btn-export text-sm"><i class="fas fa-file-export"></i> 匯出網頁</button>
            <button onclick="openEditor()" class="tool-btn btn-edit text-sm"><i class="fas fa-edit"></i> 題目修改</button>
        </div>
        <h1 class="text-3xl font-bold mb-4 text-green-600">🌟 班會生活大富翁 🌟</h1>
        <p class="mb-4 text-gray-800 font-bold text-lg">👉 請選擇遊玩人數 (1-3人)</p>
        <div class="flex justify-center gap-4 mb-2">
            <button class="btn" onclick="startGame(1)">1 人</button>
            <button class="btn" onclick="startGame(2)">2 人</button>
            <button class="btn" onclick="startGame(3)">3 人</button>
        </div>
    </div>
</div>

<div id="question-modal" class="overlay hidden">
    <div class="modal">
        <div id="q-icon" class="text-5xl mb-2"></div>
        <h2 id="q-title" class="text-2xl font-bold mb-2"></h2>
        <p id="q-content" class="text-lg text-gray-700 mb-6 font-bold"></p>
        <div id="q-options"></div>
    </div>
</div>

<div id="win-screen" class="overlay hidden">
    <div class="modal">
        <h1 class="text-4xl font-bold mb-4 text-yellow-500">🎉 恭喜過關！ 🎉</h1>
        <div id="rankings" class="mb-6 space-y-3"></div>
        <button class="btn" onclick="location.reload()">重新開始</button>
    </div>
</div>

<div id="editor-modal" class="overlay bg-black/50 hidden">
    <div class="modal editor-modal flex flex-col h-[85vh]">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
            <h2 class="text-2xl font-bold text-gray-800">修改題目 (雲端同步)</h2>
            <button onclick="closeEditor()" class="text-gray-500 text-3xl">×</button>
        </div>
        <div id="editor-list" class="flex-1 overflow-y-auto pr-2 space-y-4"></div>
        <div class="mt-4 pt-4 border-t flex justify-end">
            <button onclick="saveAllTiles()" class="btn">儲存並更新</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
// --- Firebase ---
const firebaseConfig = {

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let tilesData = [
    { "correct": 2, "icon": "🚩", "options": ["站在旁邊一直拍老師的肩膀，直到他轉過頭。", "大聲喊老師的名字，讓他知道你在等他。", "暫停等一等，安靜等待且不打斷談話。 ", "直接插話，趕快把自己的事情說完"], "q": "如果你有事情想找支持者，但發現他正在忙碌，正確的做法是什麼？", "title": "互動禮儀", "type": "start" },
    { "correct": 1, "icon": "🤫", "options": ["大聲呼喊", "輕聲問候或點頭微笑", "一直喊:老師好"], "q": "在走廊遇到支持者應如何問好？", "title": "小聲問好" },
    { "correct": 1, "icon": "😷", "options": ["露出口鼻", "完整遮蓋口鼻", "掛在耳朵上"], "q": "感冒咳嗽時，口罩該怎麼戴？", "title": "口罩禮儀" },
    { "correct": 1, "icon": "🚶", "options": ["只要把大件垃圾帶走，細小的屑屑可以留到明天處理。", "確保桌面乾淨，椅子靠攏", "因為明天還要繼續工作，所有東西可以散落在桌上。", "只要有打卡，桌面整潔不重要"], "q": "關於下班離開前的「桌面檢查」，下列哪一項敘述是正確的", "title": "桌面清潔" },
    { "correct": 2, "icon": "⏰", "options": ["直接擠進兩個人中間，跟他們一起玩 ", "站在旁邊拍打對方的身體來引起注意", "保持「平舉一隻手」的距離，先詢問再加入"], "q": "在休息或玩耍時間，如果兩位男生正在聊天或活動，你如果想要加入時，哪一種做法最合適", "title": "社交禮儀" },
    { "correct": 1, "icon": "♻️", "options": ["一般垃圾", "資源回收", "廚餘桶"], "q": "喝完的鋁箔包應該丟哪？", "title": "垃圾分類" },
    { "correct": 3, "icon": "🧹", "options": ["A. 假裝沒看見。", "B. 等支持者過來要求時才進行清理。", "C. 「明天再擦就好」。", "D. 主動拿酒精跟濕紙巾擦桌子"], "q": "發現自己的桌面處於「不合格（X）」的狀態，應該怎麼辦？", "title": "整潔桌面" },
    { "correct": 1, "icon": "🚶‍♂️", "options": ["奔跑競逐", "安靜慢走", "嘻笑打鬧"], "q": "在走廊上應該？", "title": "走廊漫步" },
    { "correct": 1, "icon": "🚰", "options": ["代表你們感情很好，可以繼續靠近 ", "這代表距離「太近了」，應該往後退一步 ", "代表你可以開始跟對方玩推擠遊戲"], "q": "當你想跟同儕一起玩，但發現你的手平舉後會碰到對方的身體，這代表什麼？", "title": "社交禮儀" },
    { "correct": 2, "icon": "💡", "options": [" 只有跟老師說話才需要保持距離 ", "好朋友之間可以不用管社交距離 ", "記住「平舉一隻手」的長度，這是你與別人的安全界線 ", "只要對方沒有生氣，就可以一直靠在他身上"], "q": "關於與同儕互動時的「安全空間」，下列哪一個敘述是正確的？", "title": "社交禮儀" },
    { "correct": 1, "icon": "🛡️", "options": ["支持者正坐在位子上看著門口。 ", "支持者正在講電話，或是正與其他支持者講事情。 ", "支持者剛好忙完工作"], "q": "當你想找支持者（老師）說話時，下列哪一種狀況代表現在是「紅燈」，「不能」打擾？", "title": "社交禮儀" },
    { "correct": 3, "icon": "🎁", "options": ["老師講電話時等於亮起「紅燈」。 ", "遇到小事情時應該先暫停等一等。 ", "即使是支持者，與他說話時仍應保持適當的社交距離。 ", "為了獲得老師注意，可以在支持者跟別人講話時直接一直叫老師。"], "q": "關於與支持者的互動禮儀，下列敘述何者「錯誤」？", "title": "社交禮儀" },
    { "correct": 1, "icon": "📖", "options": ["為了表示熱情，要不斷地大聲打招呼。", "打招呼只打一次，並保持輕聲，避免吵到同儕。", "裝作沒看到", "停下打菜動作，與對方聊天。"], "q": "打菜時如果遇到同學或支持者要打招呼，正確的做法是什麼？", "title": "打菜禮儀" },
    { "correct": 2, "icon": "🤝", "options": [" 為了節省時間，打完後直接讓蓋子掉下去。", "蓋子不需要蓋，等最後一個人打完說。", "應該輕輕地將蓋子蓋上去，避免發出巨大的撞擊聲。"], "q": "關於「打菜蓋子」的使用方式，下列哪一項敘述是正確的？", "title": "打菜禮儀" },
    { "correct": 1, "icon": "😴", "options": ["跟老師聊天", "保持安靜", "製造聲音吵同儕"], "q": "午休時間應該？", "title": "午休靜悄悄" },
    { "correct": 0, "icon": "📝", "options": ["必須戴好口罩 。", "一邊打菜一邊打招呼。", "要站在離桌子一公尺遠的地方。"], "q": "打菜時除了保持安靜，還必須落實哪一項衛生措施？", "title": "打菜禮儀" },
    { "correct": 1, "icon": "✨", "options": ["找對方吵架", "去廚房冷靜一下，或是喝杯冰水。 ", "用力敲桌子，摔門來表達情緒"], "q": "當你因為同儕的行為感到情緒上來（生氣或難過）時，下列哪一種做法是正確的「冷靜」方式？", "title": "情緒調節" },
    { "correct": 1, "icon": "💎", "options": ["像小貓一樣輕輕地走出去。", "用力「摔門」來發洩不爽。 ", "找支持者訴說。 ", "保持社交距離慢慢走開"], "q": "當你心情不好、想離開現場時，哪一種「離開方式」是錯誤且「絕對不可以」做的？", "title": "情緒調節" },
    { "correct": 2, "icon": "🎨", "options": ["要記得帶錢 ", "要帶聯絡卡 ", "必須背著大書包出門", "帶袋子"], "q": "關於社區活動的出門準備，下列哪一項敘述是「錯誤」的？", "title": "社區活動" },
    { "correct": 1, "icon": "🏅", "options": ["布丁", "果凍", "咖啡凍"], "q": "這禮拜的點心製作要做什麼", "title": "休閒活動" }
];

const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
let w, h, players = [], currentPlayerIdx = 0, mapCoords = [], isAnimating = false;

function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; calcMapCoords(); drawBoard(); }
function calcMapCoords() {
    mapCoords = []; let mw = w * 0.85, mh = mw / 1.5; if (mh > h * 0.85) { mh = h * 0.85; mw = mh * 1.5; }
    const ox = (w-mw)/2, oy = (h-mh)/2, tw = mw/6, th = mh/4;
    for(let i=0; i<=6; i++) mapCoords.push({x: ox+i*tw, y: oy+mh});
    for(let i=1; i<=3; i++) mapCoords.push({x: ox+mw, y: oy+mh-i*th});
    for(let i=6; i>=0; i--) mapCoords.push({x: ox+i*tw, y: oy});
    for(let i=1; i<=3; i++) mapCoords.push({x: ox, y: oy+i*th});
}
function drawBoard() {
    ctx.fillStyle = '#cffafe'; ctx.fillRect(0, 0, w, h); const size = Math.min(w,h)*0.05;
    mapCoords.forEach((c, i) => {
        const d = tilesData[i]; ctx.fillStyle = "white"; ctx.strokeStyle = "#22c55e"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.roundRect(c.x-size, c.y-size, size*2, size*2, 12); ctx.fill(); ctx.stroke();
        ctx.font = `${size*0.8}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(d.icon, c.x, c.y-size*0.1);
        ctx.font = `bold ${size*0.3}px Microsoft JhengHei`; ctx.fillStyle = '#166534'; ctx.fillText(d.title, c.x, c.y+size*0.6);
    });
    players.forEach((p, idx) => {
        const offset = (idx - (players.length-1)/2)*20;
        ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.visX+offset, p.visY, 15, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "white"; ctx.lineWidth = 2; ctx.stroke();
    });
}
function startGame(c) {
    const cls = ['#ef4444', '#3b82f6', '#f59e0b']; players = [];
    for(let i=0; i<c; i++) players.push({ pos: 0, score: 0, color: cls[i], visX: mapCoords[0].x, visY: mapCoords[0].y });
    document.getElementById('setup-screen').classList.add('hidden'); document.getElementById('ui-layer').classList.remove('hidden'); document.getElementById('dice-btn').classList.remove('hidden');
    updateUI(); loop();
}
function loop() { drawBoard(); requestAnimationFrame(loop); }
function updateUI() {
    const l = document.getElementById('players-list');
    l.innerHTML = players.map((p, i) => `<div class="bg-white p-2 rounded-lg border ${i === currentPlayerIdx ? 'border-blue-500 ring-2' : ''} flex justify-between"><span style="color:${p.color}">玩家 ${i+1}</span><span>${p.score} 分</span></div>`).join('');
}
document.getElementById('dice-btn').onclick = () => {
    if(isAnimating) return; const roll = Math.floor(Math.random()*6)+1;
    document.getElementById('dice-btn').innerText = `🎲 ${roll}`; movePlayer(players[currentPlayerIdx], roll);
};
function movePlayer(p, s) {
    isAnimating = true; let c = 0;
    const inv = setInterval(() => {
        p.pos = (p.pos+1)%20; p.visX = mapCoords[p.pos].x; p.visY = mapCoords[p.pos].y; c++;
        if(c >= s) { clearInterval(inv); isAnimating = false; showQuestion(tilesData[p.pos]); }
    }, 300);
}
function showQuestion(t) {
    if(t.type === 'start') { nextTurn(); return; }
    document.getElementById('q-icon').innerText = t.icon; document.getElementById('q-title').innerText = t.title; document.getElementById('q-content').innerText = t.q;
    const o = document.getElementById('q-options'); o.innerHTML = "";
    t.options.forEach((txt, i) => {
        const b = document.createElement('button'); b.className = "opt-btn"; b.innerText = `${i+1}. ${txt}`;
        b.onclick = () => {
            document.getElementById('question-modal').classList.add('hidden');
            if(i === t.correct) { players[currentPlayerIdx].score += 10; alert("答對了！"); } else alert("答錯了！");
            if(players[currentPlayerIdx].score >= 100) alert("恭喜獲勝！"); else nextTurn();
        }; o.appendChild(b);
    }); document.getElementById('question-modal').classList.remove('hidden');
}
function nextTurn() { currentPlayerIdx = (currentPlayerIdx+1)%players.length; updateUI(); }

function openEditor() {
    const l = document.getElementById('editor-list'); l.innerHTML = "";
    tilesData.forEach((t, i) => {
        const d = document.createElement('div'); d.className = "p-4 bg-gray-50 rounded border mb-4";
        d.innerHTML = `
            <div class="font-bold mb-2">第 ${i+1} 格: ${t.title}</div>
            <textarea id="edit-q-${i}" class="w-full p-1 border rounded mb-2">${t.q}</textarea>
            <textarea id="edit-opts-${i}" class="w-full p-1 border rounded mb-2" rows="3">${t.options.join('\n')}</textarea>
            <div>正確答案 (填 1, 2, 3)：<input type="number" value="${t.correct + 1}" id="edit-correct-${i}" class="w-16 border rounded text-center"></div>
        `; l.appendChild(d);
    }); document.getElementById('editor-modal').classList.remove('hidden');
}
function closeEditor() { document.getElementById('editor-modal').classList.add('hidden'); }
async function saveAllTiles() {
    tilesData.forEach((t, i) => {
        t.q = document.getElementById(`edit-q-${i}`).value;
        t.options = document.getElementById(`edit-opts-${i}`).value.split('\n').filter(s => s.trim() !== '');
        t.correct = parseInt(document.getElementById(`edit-correct-${i}`).value) - 1;
    }); await db.ref('tiles').set(tilesData); alert("同步完成！"); closeEditor();
}
async function loadFromCloud() { const s = await db.ref('tiles').once('value'); if(s.val()) { tilesData = s.val(); drawBoard(); } }
function exportGame() {
    const h = document.documentElement.outerHTML; const b = new Blob([h], {type: 'text/html'});
    const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = "index.html"; a.click();
}
window.onload = () => { resize(); loadFromCloud(); };
window.addEventListener('resize', resize);
</script>
</body>
